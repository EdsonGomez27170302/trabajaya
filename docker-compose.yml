services:
  db:
    image: postgres:16-alpine
    container_name: trabajaya-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trabajaya
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trabajaya-api
    restart: unless-stopped
    environment:
      PORT: 3004
      GIN_MODE: debug
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: trabajaya
      DB_SSLMODE: disable
      JWT_SECRET: d97990f49f564b8c982be5cfe17264db2bdc8323e9a461d75e31c719adb8d3a
      JWT_EXPIRES_HOURS: "72"
      FRONTEND_URL: http://ec2-54-152-115-100.compute-1.amazonaws.com
      CORS_ORIGIN: http://ec2-54-152-115-100.compute-1.amazonaws.com
      INSTITUTIONAL_EMAIL_DOMAIN: unsch.edu.pe
      UPLOADS_DIR: /app/uploads
      MERCADOPAGO_MODE: test
      MERCADOPAGO_ACCESS_TOKEN_TEST: ${MERCADOPAGO_ACCESS_TOKEN_TEST:-}
      MERCADOPAGO_WEBHOOK_SECRET_TEST: ${MERCADOPAGO_WEBHOOK_SECRET_TEST:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_PREMIUM_PRICE: "5.00"
      AUTO_RUN_SQL: "true"
      SQL_MIGRATION_FILE: /app/migrations.sql
    volumes:
      - uploads:/app/uploads
      - ./db/migrations.sql:/app/migrations.sql:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: trabajaya-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api
      INTERNAL_API_URL: http://backend:3004/api
      NEXT_PUBLIC_MERCADOPAGO_MODE: test
      NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY_TEST: ${MERCADOPAGO_PUBLIC_KEY_TEST:-}
      NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY_PROD: ${MERCADOPAGO_PUBLIC_KEY_PROD:-}
    ports:
      - "80:3005"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
